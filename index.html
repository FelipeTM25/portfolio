<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Felipe Torres — desarrollador full stack en Medellín. Angular, Spring Boot, React y arquitectura limpia." />
    <meta name="theme-color" content="#F1EEE7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111213" media="(prefers-color-scheme: dark)" />
    <title>Felipe Torres · Full Stack</title>
    <script>
      // Apply saved theme/lang before paint to avoid a flash.
      try {
        var t = localStorage.getItem('ft-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
        var l = localStorage.getItem('ft-lang')
        if (l === 'en' || l === 'es') document.documentElement.lang = l
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
